name: Build and Deploy Animation

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Extract ZIP
        id: project
        run: |
          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" -not -path "./.git/*" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found!"
            exit 1
          fi

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          PACKAGE=$(find extracted -type f -name "package.json" -not -path "*/node_modules/*" -print -quit)

          if [ -z "$PACKAGE" ]; then
            echo "package.json not found inside ZIP!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE")
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm install

      - name: Build React application
        working-directory: ${{ steps.project.outputs.dir }}
        run: npm run build -- --base=./

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.project.outputs.dir }}/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
